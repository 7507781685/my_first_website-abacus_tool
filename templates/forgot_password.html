<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<body class="forgot-body">

<div class="floating-shapes">
<span></span>
<span></span>
<span></span>
</div>

<div class="forgot-container">

<div class="forgot-card">

<h2>Reset Password</h2>

<p class="message">
Don't worry 😊  
Everyone forgets sometimes.  
Let's reset it and keep learning!
</p>

<div class="input-group">
<label>Email or Mobile</label>
<input type="text" id="contact" placeholder="Enter Email or Mobile">
</div>

<button class="btn-primary-custom" onclick="sendOTP()">Send OTP</button>

<div class="input-group">
<label>OTP</label>
<input type="text" id="otp" placeholder="Enter OTP">
</div>

<div class="input-group">
<label>New Password</label>
<input type="password" id="newPassword" placeholder="Create New Password">
</div>

<button class="btn-success-custom" onclick="resetPassword()">Reset Password</button>
<button class="btn-secondary-custom" onclick="window.location.href='/login-page'">
Back to Login
</button>

<p class="tip">
💡 Tip: Write your password somewhere safe so you don't forget again!
</p>

</div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
