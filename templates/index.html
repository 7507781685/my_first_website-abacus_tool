<!DOCTYPE html>
<html lang ="en">
   
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<title>Pranit Classes</title> 
</head>    
<body>
<header class="brand">    
    <img src="{{ url_for('static', filename='Logo.jpg') }}">
    <div class="brand-texts">   
    <h1 class="brand-title">Pranit Classes</h1>
    <h2 class="subtitle">Abacus Mock Tests</h2>
    </div>
</header>  

<h3 class="section-title">Student Registration</h3>
<form id="regesterForm">
    
    <label>Student Registration Number:</label><br>
    <input type="text" id="regNo" placeholder="Enter Registration No"><br><br>

    <label>Email ID:</label><br>
    <input type="email" id="email" placeholder="Enter Email ID" required><br><br>

    <label>Phone Number:</label><br>
    <input type="tel" id="phone" placeholder="Enter Phone Number" required><br><br>
    
    <label>Create Password:</label><br>
    <input type="password" id="password" placeholder="Create Password" required><br><br>
  
    <button type="button" onclick="registerUser()">Register</button>
    <button type="button" onclick="openLogin()">Login</button>
    <button type="button" onclick="forgotpassword()">Forgot Password</button>
</form>
<p class="Address">
    Row House No 21, Shahu Chowk, Peth Road,<br>
    Behind Sapatarang, Peth Road,<br>
    Nashik 422004
</p>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>    

</html>
