<!DOCTYPE html>
<html lang ="en">
   
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<title>Pranit Classes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>    
<body>
<header class="d-flex align-items-center mb-4">

<img src="{{ url_for('static', filename='images/logo.jpg') }}" width="70" class="me-3">

<div>
<h1 class="h3 mb-0">Pranit Classes</h1>
<p class="text-muted">Abacus Mock Tests</p>
</div>

</header>

<h3 class="section-title">Student Registration</h3>
<div class="card shadow p-4">

<h4 class="text-center mb-4">Student Registration</h4>

<form id="regesterForm">

<div class="mb-3">
<label class="form-label">Student Registration Number</label>
<input type="text" id="regNo" class="form-control" placeholder="Enter Registration No">
</div>

<div class="mb-3">
<label class="form-label">Email ID</label>
<input type="email" id="email" class="form-control" placeholder="Enter Email ID" required>
</div>

<div class="mb-3">
<label class="form-label">Phone Number</label>
<input type="tel" id="phone" class="form-control" placeholder="Enter Phone Number" required>
</div>

<div class="mb-3">
<label class="form-label">Create Password</label>
<input type="password" id="password" class="form-control" placeholder="Create Password" required>
</div>

<button type="button" class="btn btn-primary w-100 mb-2" onclick="registerUser()">Register</button>

<button type="button" class="btn btn-success w-100 mb-2" onclick="openLogin()">Login</button>

<button type="button" class="btn btn-warning w-100" onclick="forgotpassword()">Forgot Password</button>

</form>

</div>

<p class="text-center mt-4 text-muted">
    Row House No 21, Shahu Chowk, Peth Road,<br>
    Behind Sapatarang, Peth Road,<br>
    Nashik 422004
</p>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>    

</html>
